<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!--
    Panel banner, 3:1. Sits at the bottom of branded embeds, so the composition
    is weighted left — Discord crops the right edge on narrow clients.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141d"/>
      <stop offset="60%" stop-color="#161927"/>
      <stop offset="100%" stop-color="#1c1533"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Ambient light behind the mark -->
  <ellipse cx="170" cy="200" rx="190" ry="150" fill="#6366f1" opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="980" cy="330" rx="260" ry="160" fill="#a855f7" opacity="0.14" filter="url(#soft)"/>

  <!-- Mark -->
  <g transform="translate(96 118) scale(0.62)">
    <path d="M110 40 L32 146 L110 252" fill="none" stroke="url(#brand)" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M214 32 L146 260" fill="none" stroke="url(#brand)" stroke-width="30" stroke-linecap="round"/>
    <path d="M250 40 L328 146 L250 252" fill="none" stroke="url(#brand)" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="330" y="196" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif"
        font-size="76" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">SamotWorks</text>
  <text x="334" y="248" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif"
        font-size="27" font-weight="500" fill="#8b90a5" letter-spacing="4.5">SOFTWARE DEVELOPMENT STUDIO</text>

  <!-- Accent rule -->
  <rect x="334" y="278" width="300" height="3" rx="1.5" fill="url(#fade)"/>
</svg>
